# Checks every push and pull request: schema, ES module syntax, unit tests.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check schema
        run: |
          sudo apt-get install -y --no-install-recommends libglib2.0-bin >/dev/null
          glib-compile-schemas --strict --dry-run schemas/

      - name: Check module syntax
        run: |
          for f in *.js; do
            cp "$f" "/tmp/$f.mjs" && node --check "/tmp/$f.mjs"
          done

      - name: Unit tests
        run: npm test

      - name: Build zip
        run: ./pack.sh ci
