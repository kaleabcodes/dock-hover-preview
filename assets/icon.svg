<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#5b7cfa"/>
      <stop offset="1" stop-color="#7c3fe0"/>
    </linearGradient>
    <linearGradient id="thumbA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9edff"/>
      <stop offset="1" stop-color="#d3dbff"/>
    </linearGradient>
    <linearGradient id="thumbB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d3142"/>
      <stop offset="1" stop-color="#1f2230"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1b0f4d" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#1b0f4d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Preview popup (with its pointer towards the hovered icon) -->
  <g filter="url(#shadow)">
    <rect x="34" y="34" width="188" height="118" rx="18" fill="#ffffff"/>
    <path d="M116 151 L128 164 L140 151 Z" fill="#ffffff"/>
  </g>

  <!-- Window card A -->
  <rect x="46" y="46" width="78" height="94" rx="10" fill="#f3f5fb"/>
  <circle cx="56" cy="56" r="4.5" fill="#3584e4"/>
  <rect x="64" y="53" width="36" height="6" rx="3" fill="#c3c9dc"/>
  <path d="M110 53 l6 6 M116 53 l-6 6" stroke="#8a90a6" stroke-width="2" stroke-linecap="round"/>
  <rect x="52" y="66" width="66" height="66" rx="6" fill="url(#thumbA)"/>
  <rect x="52" y="66" width="18" height="66" rx="6" fill="#bcc6f5"/>
  <rect x="76" y="74" width="36" height="6" rx="3" fill="#ffffff"/>
  <rect x="76" y="86" width="28" height="6" rx="3" fill="#ffffff"/>
  <rect x="76" y="98" width="34" height="6" rx="3" fill="#ffffff"/>
  <rect x="76" y="112" width="22" height="12" rx="3" fill="#8fa2f7"/>

  <!-- Window card B (focused) -->
  <rect x="132" y="46" width="78" height="94" rx="10" fill="#eef2ff" stroke="#3584e4" stroke-width="2.5"/>
  <circle cx="142" cy="56" r="4.5" fill="#3584e4"/>
  <rect x="150" y="53" width="36" height="6" rx="3" fill="#c3c9dc"/>
  <path d="M196 53 l6 6 M202 53 l-6 6" stroke="#8a90a6" stroke-width="2" stroke-linecap="round"/>
  <rect x="138" y="66" width="66" height="66" rx="6" fill="url(#thumbB)"/>
  <rect x="144" y="74" width="30" height="5" rx="2.5" fill="#57e389"/>
  <rect x="144" y="84" width="46" height="5" rx="2.5" fill="#99c1f1"/>
  <rect x="144" y="94" width="38" height="5" rx="2.5" fill="#dc8add"/>
  <rect x="144" y="104" width="50" height="5" rx="2.5" fill="#99c1f1"/>
  <rect x="144" y="114" width="26" height="5" rx="2.5" fill="#f8e45c"/>

  <!-- Dock -->
  <rect x="26" y="172" width="204" height="48" rx="18" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="38" y="182" width="28" height="28" rx="8" fill="#ffa348" filter="url(#soft)"/>
  <rect x="76" y="182" width="28" height="28" rx="8" fill="#33d17a" filter="url(#soft)"/>
  <!-- hovered app -->
  <rect x="110" y="176" width="36" height="36" rx="11" fill="#ffffff" fill-opacity="0.35"/>
  <rect x="114" y="180" width="28" height="28" rx="8" fill="#3584e4" filter="url(#soft)"/>
  <rect x="120" y="187" width="16" height="12" rx="2.5" fill="none" stroke="#ffffff" stroke-width="2.2"/>
  <circle cx="128" cy="215" r="2.6" fill="#ffffff"/>
  <rect x="152" y="182" width="28" height="28" rx="8" fill="#f66151" filter="url(#soft)"/>
  <rect x="190" y="182" width="28" height="28" rx="8" fill="#c061cb" filter="url(#soft)"/>

  <!-- Pointer -->
  <path d="M134 192 L134 214 L139.5 208.5 L143.5 217 L147 215.5 L143 207 L150.5 207 Z"
        fill="#1e1e22" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
</svg>
